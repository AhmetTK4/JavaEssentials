name: Java examples
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: stream-patterns
            java: '21'
          - project: transactional-events
            java: '21'
          - project: jpa-pagination
            java: '21'
          - project: scoped-values
            java: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify example
        run: mvn -B -ntp -f ${{ matrix.project }}/pom.xml verify
